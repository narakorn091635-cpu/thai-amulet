services:
  - type: web
    name: thai-amulet-platform
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: thai_amulet_db
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: ""
